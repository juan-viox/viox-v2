name: VioX Blog — Daily Generation

on:
  schedule:
    # 06:00 UTC Mon-Fri + Sun (Saturday skipped per strategy)
    # Article generates → eval → commit → Vercel rebuild before n8n's 13:00 UTC social trigger
    - cron: "0 6 * * 1-5"
    - cron: "0 12 * * 0"
  workflow_dispatch:
    # Manual trigger from the Actions UI for ad-hoc runs / testing
    inputs:
      dry_run:
        description: "Dry run (don't commit)"
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Generate article
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          OUTPUT=$(node scripts/generate-blog.mjs 2>&1 | tee /tmp/gen.log)
          echo "$OUTPUT"
          # Extract slug for downstream steps
          SLUG=$(echo "$OUTPUT" | grep -oE '/blog/[a-z0-9-]+' | tail -1 | sed 's|/blog/||')
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          if [ -z "$SLUG" ]; then
            echo "::warning::No slug emitted (likely 'no publishing today' or generation failed)"
          fi

      - name: Run eval gates
        if: steps.generate.outputs.slug != ''
        id: eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: |
          node scripts/eval-blog.mjs "${{ steps.generate.outputs.slug }}"

      - name: Commit + push
        if: steps.generate.outputs.slug != '' && steps.eval.outcome == 'success' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "viox-blog-bot"
          git config user.email "blog-bot@viox.ai"
          git add content/blog content/social .blog-runs
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          SLUG="${{ steps.generate.outputs.slug }}"
          git commit -m "blog: $SLUG

          Generated by daily pipeline. Voice + slop gates passed."
          git push

      - name: Open issue on eval fail
        if: steps.eval.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const slug = '${{ steps.generate.outputs.slug }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Blog draft needs review: ${slug}`,
              body: `Today's auto-generated draft failed an eval gate. See \`.blog-runs/\` for the report.

The draft has been moved to:
- \`site-v2/content/blog/_drafts/${slug}.md\`
- \`site-v2/content/social/_drafts/${slug}.json\`

Review, fix, and move back to \`content/blog/\` and \`content/social/\` to publish.`,
              labels: ['blog', 'needs-review'],
            });

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-run-${{ github.run_id }}
          path: |
            .blog-runs/
            content/blog/_drafts/
            content/social/_drafts/
          retention-days: 30
          if-no-files-found: ignore

