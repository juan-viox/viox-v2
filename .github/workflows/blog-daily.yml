name: VioX Blog Daily Generation

on:
  schedule:
    - cron: "0 6 * * 1-5"
    - cron: "0 12 * * 0"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Generate article
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          OUTPUT=$(node scripts/generate-blog.mjs 2>&1 | tee /tmp/gen.log)
          echo "$OUTPUT"
          SLUG=$(echo "$OUTPUT" | grep -oE '/blog/[a-z0-9-]+' | tail -1 | sed 's|/blog/||')
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          if [ -z "$SLUG" ]; then
            echo "::warning::No slug emitted (no publishing today or generation failed)"
          fi

      - name: Run eval gates
        if: steps.generate.outputs.slug != ''
        id: eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        continue-on-error: true
        run: node scripts/eval-blog.mjs "${{ steps.generate.outputs.slug }}"

      - name: Commit and push
        if: steps.generate.outputs.slug != '' && steps.eval.outcome == 'success'
        env:
          SLUG: ${{ steps.generate.outputs.slug }}
        run: |
          git config user.name "viox-blog-bot"
          git config user.email "blog-bot@viox.ai"
          git add content/blog content/social .blog-runs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "blog: $SLUG"
          git push

      - name: Open issue on eval fail
        if: steps.eval.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.generate.outputs.slug }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Blog draft needs review: $SLUG" \
            --body "Auto-generated draft failed an eval gate. See .blog-runs/ for the report. Draft moved to content/blog/_drafts/$SLUG.md and content/social/_drafts/$SLUG.json. Move back to content/blog/ and content/social/ to publish." \
            --label "blog,needs-review" || echo "Issue creation failed"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-run-${{ github.run_id }}
          path: |
            .blog-runs/
            content/blog/_drafts/
            content/social/_drafts/
          retention-days: 30
          if-no-files-found: ignore
